services:
  - type: web
    name: aurachat-server
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        value: https://aurachat.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
